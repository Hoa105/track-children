components:
  schemas:
    AppleEvent:
      properties:
        payload:
          type: string
          maxLength: 20000
          minLength: 1
          title: Payload
      additionalProperties: false
      type: object
      required:
      - payload
      title: AppleEvent
    ChangePassword:
      properties:
        newPassword:
          type: string
          title: Newpassword
        confirmPassword:
          type: string
          title: Confirmpassword
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
          title: Currentpassword
        device:
          $ref: '#/components/schemas/Device'
      additionalProperties: false
      type: object
      required:
      - newPassword
      - confirmPassword
      - currentPassword
      - device
      title: ChangePassword
    Complete:
      properties:
        displayName:
          type: string
          title: Displayname
        defaultRelationship:
          type: string
          enum:
          - mother
          - father
          - grandfather
          - grandmother
          - other_guardian
          title: Defaultrelationship
        acceptedTerms:
          type: boolean
          title: Acceptedterms
        documentsDigest:
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          title: Documentsdigest
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
        password:
          type: string
          title: Password
        confirmPassword:
          type: string
          title: Confirmpassword
        device:
          $ref: '#/components/schemas/Device'
        rememberMe:
          type: boolean
          title: Rememberme
          default: true
      additionalProperties: false
      type: object
      required:
      - displayName
      - defaultRelationship
      - acceptedTerms
      - documentsDigest
      - transactionId
      - transactionToken
      - password
      - confirmPassword
      - device
      title: Complete
    DeleteAccount:
      properties:
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
        appleCredential:
          anyOf:
          - $ref: '#/components/schemas/SocialStart'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - transactionId
      - transactionToken
      title: DeleteAccount
    Device:
      properties:
        deviceId:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Deviceid
        deviceName:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Devicename
        platform:
          type: string
          enum:
          - android
          - ios
          - web
          title: Platform
      additionalProperties: false
      type: object
      required:
      - platform
      title: Device
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IdentifierVerify:
      properties:
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
        code:
          type: string
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          title: Code
      additionalProperties: false
      type: object
      required:
      - transactionId
      - transactionToken
      - code
      title: IdentifierVerify
    ProviderLink:
      properties:
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
        credential:
          $ref: '#/components/schemas/SocialStart'
      additionalProperties: false
      type: object
      required:
      - transactionId
      - transactionToken
      - credential
      title: ProviderLink
    ProviderUnlink:
      properties:
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
        provider:
          type: string
          enum:
          - google
          - apple
          title: Provider
        credential:
          anyOf:
          - $ref: '#/components/schemas/SocialStart'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - transactionId
      - transactionToken
      - provider
      title: ProviderUnlink
    Reauth:
      properties:
        action:
          type: string
          enum:
          - change_email
          - change_phone
          - set_password
          - delete_account
          - link_google
          - link_apple
          - unlink_google
          - unlink_apple
          title: Action
        target:
          anyOf:
          - type: string
          - type: 'null'
          title: Target
        currentPassword:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Currentpassword
        providerCredential:
          anyOf:
          - $ref: '#/components/schemas/SocialStart'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - action
      title: Reauth
    RecoveryComplete:
      properties:
        newPassword:
          type: string
          title: Newpassword
        confirmPassword:
          type: string
          title: Confirmpassword
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
      additionalProperties: false
      type: object
      required:
      - newPassword
      - confirmPassword
      - transactionId
      - transactionToken
      title: RecoveryComplete
    RecoveryEmail:
      properties:
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
      additionalProperties: false
      type: object
      required:
      - transactionId
      - transactionToken
      title: RecoveryEmail
    RecoveryProvider:
      properties:
        provider:
          type: string
          enum:
          - google
          - apple
          title: Provider
        idToken:
          type: string
          maxLength: 16000
          minLength: 1
          title: Idtoken
        authorizationCode:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Authorizationcode
        challenge:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Challenge
        displayName:
          type: string
          maxLength: 150
          title: Displayname
          default: ''
        device:
          $ref: '#/components/schemas/Device'
        rememberMe:
          type: boolean
          title: Rememberme
          default: true
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
      additionalProperties: false
      type: object
      required:
      - provider
      - idToken
      - device
      - transactionId
      - transactionToken
      title: RecoveryProvider
    RecoveryResend:
      properties:
        transactionId:
          type: string
          format: uuid
          title: Transactionid
        transactionToken:
          type: string
          maxLength: 256
          minLength: 32
          title: Transactiontoken
        device:
          $ref: '#/components/schemas/Device'
      additionalProperties: false
      type: object
      required:
      - transactionId
      - transactionToken
      - device
      title: RecoveryResend
    RecoveryStart:
      properties:
        identifier:
          type: string
          title: Identifier
        device:
          $ref: '#/components/schemas/Device'
      additionalProperties: false
      type: object
