openapi: 3.1.0
info:
  title: Track Children - Mobile Auth API
  version: 2.0.0
  description: '# App registration with schema 009


    Updated October 23, 2026. This document replaces the registration, OTP and session
    sections of the previous auth contract.

    Password login and web admin authentication will be aligned in a subsequent work
    item.


    Updated October 25, 2026: added app account profile and password update APIs.'
servers:
- url: http://localhost:8000/api/v1
  description: Local backend
tags:
- name: Mobile Auth
paths:
  /legal-documents:
    get:
      operationId: get_legal_documents
      tags:
      - Mobile Auth
      summary: Get registration legal documents
      description: Schema 009. See docs/api/mobile-registration-v2.md for behavior
        and deployment configuration.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentsResult'
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DATABASE_UNAVAILABLE; LEGAL_DOCUMENTS_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: context
        in: query
        required: true
        schema:
          type: string
          enum:
          - registration
  /auth/register:
    post:
      operationId: post_auth_register
      tags:
      - Mobile Auth
      summary: Register an account
      description: Schema 009. See docs/api/mobile-registration-v2.md for behavior
        and deployment configuration.
      security: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallenge'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '409':
          description: ACCOUNT_CONFLICT; LEGAL_CONSENT_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
                minimum: 0
        '503':
          description: DATABASE_UNAVAILABLE; AUTH_NOT_CONFIGURED; LEGAL_DOCUMENTS_UNAVAILABLE;
            OTP_DELIVERY_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/register/verify:
    post:
      operationId: post_auth_register_verify
      tags:
      - Mobile Auth
      summary: Verify the registration OTP
      description: Schema 009. See docs/api/mobile-registration-v2.md for behavior
        and deployment configuration.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: OTP_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: REGISTRATION_CHALLENGE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCOUNT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: OTP_ALREADY_USED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: OTP_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: OTP_ATTEMPTS_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
                minimum: 0
        '503':
          description: DATABASE_UNAVAILABLE; AUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
  /auth/register/resend:
    post:
      operationId: post_auth_register_resend
      tags:
      - Mobile Auth
      summary: Resend the registration OTP
      description: Schema 009. See docs/api/mobile-registration-v2.md for behavior
        and deployment configuration.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallenge'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '401':
          description: REGISTRATION_CHALLENGE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCOUNT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
                minimum: 0
        '503':
          description: DATABASE_UNAVAILABLE; AUTH_NOT_CONFIGURED; OTP_DELIVERY_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
  /auth/login:
    post:
      operationId: post_auth_login
      tags:
      - Mobile Auth
      summary: Log in
      description: Password login still requires migration to schema 009.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: VERIFICATION_REQUIRED; ACCOUNT_LOCKED; ACCOUNT_DELETION_IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: LOGIN_TEMPORARILY_LOCKED; RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
                minimum: 0
        '503':
          description: DATABASE_UNAVAILABLE; AUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      operationId: post_auth_refresh
      tags:
      - Mobile Auth
      summary: Refresh the session
      description: Schema 009. See docs/api/mobile-registration-v2.md for behavior
        and deployment configuration.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResult'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '401':
          description: REFRESH_TOKEN_INVALID; SESSION_EXPIRED; SESSION_REVOKED; REFRESH_TOKEN_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCOUNT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DATABASE_UNAVAILABLE; AUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /auth/logout:
    post:
      operationId: post_auth_logout
      tags:
      - Mobile Auth
      summary: Log out
      description: Schema 009. See docs/api/mobile-registration-v2.md for behavior
        and deployment configuration.
      security: []
      responses:
        '204':
          description: No content; idempotent logout.
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DATABASE_UNAVAILABLE; AUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
  /auth/me:
    get:
      operationId: get_auth_me
      tags:
      - Mobile Auth
      summary: Get the current user
      description: Schema 009. See docs/api/mobile-registration-v2.md for behavior
        and deployment configuration.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: ACCESS_TOKEN_INVALID; ACCESS_TOKEN_EXPIRED; SESSION_EXPIRED;
            SESSION_REVOKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum:
                - Bearer
        '403':
          description: ACCOUNT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DATABASE_UNAVAILABLE; AUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patch_auth_me
      summary: Update the app account profile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/social:
    post:
      operationId: social_register
      tags:
      - Mobile Auth
      description: Google/Apple verified sign-in. See docs/api/mobile-social-auth.md.
        No automatic email linking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialRegisterRequest'
      responses:
        '200':
          description: App session and isNewUser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: SOCIAL_TOKEN_INVALID
        '403':
          description: Unverified email or unavailable account
        '409':
          description: SOCIAL_ACCOUNT_CONFLICT
        '503':
          description: Provider not configured or unavailable
  /auth/social/apple/challenge:
    post:
      operationId: apple_social_challenge
      tags:
      - Mobile Auth
      responses:
        '200':
          description: Ten-minute signed challenge and nonce
        '503':
          description: SOCIAL_AUTH_NOT_CONFIGURED
  /auth/change-password:
    post:
      operationId: post_auth_change_password
      summary: Change the app account password
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; all sessions are revoked.
        '401':
          description: INVALID_CREDENTIALS or invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
      - id
      - email
      - phone
      - fullName
      - relationship
      - status
      - emailVerifiedAt
      - phoneVerifiedAt
      - displayName
      - defaultRelationship
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
        phone:
          type:
          - string
          - 'null'
        fullName:
          type: string
        relationship:
          type: string
          enum:
          - mother
          - father
          - grandfather
          - grandmother
          - other_guardian
        status:
          type: string
          enum:
          - active
        emailVerifiedAt:
          type:
          - string
          - 'null'
          format: date-time
        phoneVerifiedAt:
          type:
          - string
          - 'null'
          format: date-time
        defaultRelationship:
          type: string
          enum:
          - mother
          - father
          - grandfather
          - grandmother
          - other_guardian
        displayName:
          type: string
    Device:
      additionalProperties: false
      properties:
        deviceId:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Deviceid
        deviceName:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          default: null
          title: Devicename
        platform:
          enum:
          - android
          - ios
          - web
          title: Platform
          type: string
      required:
      - platform
      title: Device
      type: object
    AuthResult:
      type: object
      required:
      - tokenType
      - accessToken
      - expiresIn
      - refreshToken
      - sessionExpiresAt
      - user
      properties:
        tokenType:
          type: string
          enum:
          - Bearer
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
        refreshToken:
          type: string
        sessionExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        deletionRequestCancelled:
          type: boolean
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - fields
          - details
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            details:
              type: object
              additionalProperties: true
              properties:
                registration:
                  $ref: '#/components/schemas/RegistrationChallenge'
                attemptsRemaining:
                  type: integer
                  minimum: 0
                  maximum: 5
    LegalDocumentsResult:
      type: object
      required:
      - documents
      properties:
        documents:
          type: array
          items:
            type: object
            required:
            - docType
            - version
            - content
            - isRequired
            - effectiveAt
            properties:
              docType:
                type: string
                enum:
                - terms
                - privacy
                - data_policy
              version:
                type: string
              content:
                type: string
              isRequired:
                type: boolean
              effectiveAt:
                type: string
                format: date-time
    RegisterRequest:
      additionalProperties: false
      properties:
        displayName:
          default: Phụ huynh
          maxLength: 150
          title: Displayname
          type: string
        email:
          anyOf:
          - format: email
            maxLength: 254
            type: string
          - type: 'null'
          default: null
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Phone
        password:
          maxLength: 64
          minLength: 8
          title: Password
          type: string
        defaultRelationship:
          default: mother
          enum:
          - mother
          - father
          - grandfather
          - grandmother
          - other_guardian
          title: Defaultrelationship
          type: string
        acceptedTerms:
          title: Acceptedterms
          type: boolean
      required:
      - password
      - acceptedTerms
      title: Register
      type: object
    RegistrationChallenge:
      type: object
      required:
      - verificationId
      - registrationToken
      - targetMasked
      - expiresAt
      - resendAvailableAt
      - deliveryStatus
      properties:
        verificationId:
          type: string
          format: uuid
        registrationToken:
          type: string
        targetMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum:
          - sent
          - failed
          - preview
        requiresOtp:
          type: boolean
          const: true
        channel:
          type: string
          enum:
          - email
          - sms
        devOtp:
          type: string
          description: Local preview only
    VerifyRequest:
      additionalProperties: false
      properties:
        verificationId:
          format: uuid
          title: Verificationid
          type: string
        registrationToken:
          maxLength: 512
          minLength: 1
          title: Registrationtoken
          type: string
        code:
          pattern: ^[0-9]{6}$
          title: Code
          type: string
        rememberMe:
          default: true
          title: Rememberme
          type: boolean
        device:
          $ref: '#/components/schemas/Device'
      required:
      - verificationId
      - registrationToken
      - code
      - device
      title: Verify
      type: object
    ResendRequest:
      additionalProperties: false
      properties:
        verificationId:
          format: uuid
          title: Verificationid
          type: string
        registrationToken:
          maxLength: 512
          minLength: 1
          title: Registrationtoken
          type: string
      required:
      - verificationId
      - registrationToken
      title: Challenge
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          anyOf:
          - format: email
            maxLength: 254
            type: string
          - type: 'null'
          default: null
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Phone
        password:
          maxLength: 128
          minLength: 1
          title: Password
          type: string
        rememberMe:
          default: true
          title: Rememberme
          type: boolean
        device:
          $ref: '#/components/schemas/Device'
      required:
      - password
      - device
      title: Login
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        refreshToken:
          maxLength: 512
          minLength: 1
          title: Refreshtoken
          type: string
      required:
      - refreshToken
      title: Refresh
      type: object
    TokenResult:
      type: object
      required:
      - tokenType
      - accessToken
      - expiresIn
      - refreshToken
      - sessionExpiresAt
      properties:
        tokenType:
          type: string
          enum:
          - Bearer
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
        refreshToken:
          type: string
        sessionExpiresAt:
          type: string
          format: date-time
    LogoutRequest:
      additionalProperties: false
      properties:
        refreshToken:
          maxLength: 512
          minLength: 1
          title: Refreshtoken
          type: string
      required:
      - refreshToken
      title: Refresh
      type: object
    SocialRegisterRequest:
      additionalProperties: false
      properties:
        provider:
          enum:
          - google
          - apple
          title: Provider
          type: string
        idToken:
          maxLength: 16000
          minLength: 1
          title: Idtoken
          type: string
        authorizationCode:
          anyOf:
          - maxLength: 4096
            type: string
          - type: 'null'
          default: null
          title: Authorizationcode
        challenge:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          default: null
          title: Challenge
        displayName:
          default: Phụ huynh
          maxLength: 150
          title: Displayname
          type: string
        defaultRelationship:
          default: mother
          enum:
          - mother
          - father
          - grandfather
          - grandmother
          - other_guardian
          title: Defaultrelationship
          type: string
        acceptedTerms:
          title: Acceptedterms
          type: boolean
        rememberMe:
          default: true
          title: Rememberme
          type: boolean
        device:
          $ref: '#/components/schemas/Device'
      required:
      - provider
      - idToken
      - acceptedTerms
      - device
      title: SocialRegister
      type: object
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      - defaultRelationship
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 150
        defaultRelationship:
          type: string
          enum:
          - mother
          - father
          - grandfather
          - grandmother
          - other_guardian
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
  responses:
    Unauthorized:
      description: Invalid or expired bearer session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
x-status: registration-implemented; password-login-pending-schema-009
x-implementation-notes: "# App registration with schema 009\n\nUpdated October 23,\
  \ 2026. This document replaces the registration, OTP and session sections of the\
  \ previous auth contract.\nPassword login and web admin authentication will be aligned\
  \ in a subsequent work item.\n\n## API\n\nBase path: `/api/v1`. Send JSON. Errors\
  \ use `error.code`, `error.fields` and `error.details`.\n\n`GET /legal-documents?context=registration`\
  \ reads three deployed documents from\n`LEGAL_DOCUMENTS_PATH`: `terms`, `privacy`\
  \ and `data_policy`. The file format matches\n`backend/legal-documents.local.json`.\
  \ The sample file is for local testing only.\nMissing, invalid or not-yet-effective\
  \ content returns `503 LEGAL_DOCUMENTS_UNAVAILABLE`.\nThe removed legal/consent\
  \ tables are not used; the database only records `consented_at`.\n\n`POST /auth/register`:\n\
  \n```json\n{\n  \"displayName\": \"Ngọc Anh\",\n  \"email\": \"anh@example.com\"\
  ,\n  \"password\": \"a password 123\",\n  \"defaultRelationship\": \"mother\",\n\
  \  \"acceptedTerms\": true\n}\n```\n\nProvide exactly one of `email` or `phone`.\
  \ Vietnamese phone numbers starting with `0`\nare normalized to `+84`. The name\
  \ is optional, defaults to `Phụ huynh`, and accepts\nup to 150 characters. Passwords\
  \ contain 8–64 characters; whitespace is preserved.\nRelationship values are `mother`,\
  \ `father`, `grandfather`, `grandmother` and\n`other_guardian`. Neither `username`\
  \ nor the legacy consent list is accepted.\n\nA successful `201` response includes\
  \ `requiresOtp=true`, `verificationId`,\n`registrationToken`, `channel`, `targetMasked`,\
  \ `expiresAt`, `resendAvailableAt`\nand `deliveryStatus`. Codes are HMAC-hashed\
  \ in `account.auth_codes` with purpose\n`verify_contact`. The challenge is a signed\
  \ JWT with a dedicated audience, bound\nto the user and code, and valid for 30 minutes.\
  \ The six-digit OTP is valid for\nfive minutes and allows up to five incorrect attempts.\
  \ Resending is available\nafter 60 seconds, with limits of five codes per contact\
  \ per hour and 100 codes\nsystem-wide per hour. PostgreSQL transaction locks enforce\
  \ these limits across\nworkers; they are not IP limits. Configure IP limits at the\
  \ reverse proxy before\nmaking the service public.\n\nA pending account can only\
  \ be resumed with the same password; stored information\nis not overwritten. Active\
  \ accounts or a different password return\n`409 ACCOUNT_CONFLICT`. Requests during\
  \ the resend cooldown return\n`429 RATE_LIMITED` with the `Retry-After` header.\n\
  \n`POST /auth/register/resend`: send `verificationId` and `registrationToken`.\n\
  The response issues a new challenge and invalidates the previous code. The app\n\
  must replace the challenge even when `deliveryStatus=failed`, because the\nprevious\
  \ code has already been invalidated.\n\n`POST /auth/register/verify`: send both\
  \ challenge fields, `code`,\n`device: {\"platform\":\"android\"}` and `rememberMe`\
  \ (default: true).\nAccepted platforms are android/ios/web. Legacy device metadata\
  \ is accepted but\nnot stored. Incorrect attempts are recorded even when the API\
  \ returns an error.\nExpired codes return `OTP_EXPIRED`; exhausted attempts return\n\
  `OTP_ATTEMPTS_EXCEEDED`; stale or consumed challenges return\n`REGISTRATION_CHALLENGE_INVALID`.\n\
  \nSuccessful verification activates the user, records `email_verified_at` or\n`phone_verified_at`,\
  \ sets the code's `verified_at` and `consumed_at`, creates a\nsession, and returns\
  \ tokens and the user. The app stores the refresh token in\nsecure storage and opens\
  \ the child profile creation screen. No child profile\nis created automatically.\
  \ Concurrent or repeated verification does not create\nadditional sessions.\n\n\
  `GET /auth/me`, `POST /auth/refresh` and `POST /auth/logout` work with the new\n\
  sessions. Access tokens last 15 minutes; sessions last 30 days when remember=true\n\
  or 24 hours when false. Schema 009 keeps one refresh hash per session: the refresh\n\
  secret remains stable until expiration or revocation, without the old schema's\n\
  rotation and replay detection history. User fields `fullName` and `relationship`\n\
  remain aliases for existing app screens; `displayName` and `defaultRelationship`\n\
  are also returned. Legacy username/avatar fields are not returned.\n\n## Running\
  \ locally without providers\n\nIn `backend/.env`:\n\n```dotenv\nAPP_ENV=local\n\
  AUTH_SKIP_OTP=false\nAUTH_OTP_PREVIEW=true\nLEGAL_DOCUMENTS_PATH=legal-documents.local.json\n\
  ```\n\nStart the backend from the `backend` directory so relative paths resolve\n\
  correctly. Set `AUTH_SECRET` to at least 32 characters and point `DATABASE_URL`\n\
  to the new database. Preview mode sends no email/SMS; responses include\n`deliveryStatus=preview`\
  \ and `devOtp`, and the app clearly displays the test code.\nPreview configuration\
  \ is rejected outside APP_ENV=local. There is no need to\nswitch databases or rerun\
  \ migration 009.\n\n## Live delivery\n\n### SMTP2GO (selected provider)\n\nThe backend\
  \ integrates directly with the SMTP2GO API. In SMTP2GO, open\n`Sending > Verified\
  \ Senders > Single sender emails`, add the student email\naddress and verify it\
  \ through the received email. Create an API key under\n`Sending > API Keys`, then\
  \ configure `backend/.env`:\n\n```dotenv\nEMAIL_PROVIDER=smtp2go\nSMTP2GO_API_KEY=your-private-api-key\n\
  SMTP2GO_SENDER_EMAIL=your-verified-student-email\nSMTP2GO_SENDER_NAME=Track Children\n\
  AUTH_OTP_PREVIEW=false\nAUTH_SKIP_OTP=false\n```\n\nDo not use a Brevo API key as\
  \ an SMTP2GO key. The student mailbox password is not\nrequired. Disable preview\
  \ only after configuring the key and verified sender,\nthen restart the backend.\
  \ While local preview remains enabled, the API returns\ntest codes without calling\
  \ the provider.\n\nThe adapter calls `POST https://api.smtp2go.com/v3/email/send`\
  \ using the\n`X-Smtp2go-Api-Key` header and sender/to/subject/text_body payload\
  \ fields.\nDelivery is considered accepted only for HTTP 200 with `data.succeeded=1`,\n\
  `data.failed=0` and no errors. Automatic retries are disabled to avoid duplicate\n\
  messages. Timeouts, invalid responses and provider rejections produce\n`deliveryStatus=failed`;\
  \ the app allows resending after the cooldown.\nSee the [official API documentation](https://developers.smtp2go.com/docs/send-an-email).\n\
  \nThe local `.env` selects SMTP2GO; existing key/sender values are preserved and\n\
  missing variables are added empty. Keys or sender addresses are not automatically\n\
  copied from Brevo. Docker receives the corresponding SMTP2GO variables from the\n\
  Compose environment.\n\n### Brevo with a student email address\n\nThe Brevo adapter\
  \ is integrated directly and needs no intermediate webhook.\nCreate a Brevo account,\
  \ add the student email as a sender and verify the mailbox.\nSending permission\
  \ depends on the account and sender status. Without access to\nthe university's\
  \ DNS, the team cannot verify its domain. Brevo may replace the\nsender address.\n\
  \nOnce the sender is ready, create an API key and configure `backend/.env`\n(never\
  \ commit the key):\n\n```dotenv\nEMAIL_PROVIDER=brevo\nBREVO_API_KEY=your-private-api-key\n\
  BREVO_SENDER_EMAIL=your-student-email\nBREVO_SENDER_NAME=Track Children\nAUTH_OTP_PREVIEW=false\n\
  AUTH_SKIP_OTP=false\n```\n\nRestart the backend. The adapter calls `POST https://api.brevo.com/v3/smtp/email`\n\
  with the `api-key` header and sender/to/subject/textContent fields. Only HTTP 201\n\
  is treated as success; permission errors, exhausted quotas and timeouts produce\n\
  a failed delivery status. Missing key/sender configuration causes email\nregistration\
  \ to return OTP_DELIVERY_UNAVAILABLE. The student mailbox password\nis not required.\
  \ When preview is disabled, SMS also requires a separate live\ndelivery service;\
  \ otherwise phone registration reports that it is unavailable.\n\n### Generic webhook\n\
  \nDisable preview and configure `EMAIL_WEBHOOK_URL`, `EMAIL_WEBHOOK_TOKEN` and/or\n\
  `SMS_WEBHOOK_URL`, `SMS_WEBHOOK_TOKEN`. Webhooks must use HTTPS, accept a Bearer\n\
  token and JSON `{to, message}`; email also includes `subject`. Return 2xx when\n\
  delivery is accepted. The adapter times out after 10 seconds, does not follow\n\
  redirects, and does not log codes or tokens. Missing configuration returns\n`503\
  \ OTP_DELIVERY_UNAVAILABLE` before user creation. Delivery failures after\ncommit\
  \ return `deliveryStatus=failed`, allowing the user to resend. A 2xx\nresponse only\
  \ confirms provider acceptance, not receipt by the user.\n\nWith Docker, mount the\
  \ approved legal file into the container and set\n`LEGAL_DOCUMENTS_PATH` to its\
  \ container path. Do not deploy local test content\nto production. Google/Apple\
  \ are connected through the\n[social authentication flow](mobile-social-auth.md);\
  \ they require separate\nprovider configuration and do not use OTP demo mode.\n\n\
  Results on October 23, 2026: all 34 backend registration/contract/adapter tests\n\
  passed. The full Flutter suite had 183 passes, one skipped live test and six\nfailures\
  \ in `home_layout_test.dart` (outside registration screens). The isolated\nregistration/auth\
  \ group passed 25/25. Full app analysis still reported nine\nissues in login/forgot-password/sharing;\
  \ registration files were checked separately.\n"
