openapi: 3.1.0
info:
  title: Track Children - Mobile assessment API
  version: 1.0.0
  description: Implemented assessment API. Paths include the actual backend prefix. Mobile request/response
    fields use snake_case. Admin model-backed fields use camelCase; unmodelled action, import, preview
    and audit responses use snake_case. Free-form editorial payloads and computed commentary/action-plan
    bodies are extensible objects.
paths:
  /api/v1/children/{child_id}/assessment/overview:
    get:
      tags:
      - 'mobile: assessment'
      summary: Tổng quan đánh giá theo mốc tuổi
      operationId: overview_api_v1_children__child_id__assessment_overview_get
      security:
      - HTTPBearer: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Child Id
      - name: tz
        in: query
        required: false
        schema:
          type: integer
          maximum: 840
          minimum: -720
          default: 420
          title: Tz
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentOverview'
        '422':
          description: Request validation errors (detail array) or business validation failure (detail
            string).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ServiceError'
        '401':
          description: Missing, expired or invalid access token/session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account unavailable, insufficient permission or read-only child access.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '404':
          description: Resource missing or child access hidden from this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '503':
          description: Authentication not configured or required published content unavailable.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
      description: Requires assessment view access. Uses calendar age and tz (UTC offset in minutes, default
        +420). Milestones are 2–60 months; no current milestone before 2 months or from 61 months. Premature
        children under 24 months require explicit guidance confirmation; age is not automatically corrected.
  /api/v1/children/{child_id}/assessment/assessments:
    get:
      tags:
      - 'mobile: assessment'
      summary: Lịch sử các bài đã hoàn thành
      operationId: history_api_v1_children__child_id__assessment_assessments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Child Id
      - name: age
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Age
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentHistory'
        '422':
          description: Request validation errors (detail array) or business validation failure (detail
            string).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ServiceError'
        '401':
          description: Missing, expired or invalid access token/session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account unavailable, insufficient permission or read-only child access.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '404':
          description: Resource missing or child access hidden from this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '503':
          description: Authentication not configured or required published content unavailable.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
      description: Requires view access. Completed attempts only, newest first. Optional age filter; offset/limit
        pagination, has_more indicates another page. Summary comes from the immutable saved result.
    post:
      tags:
      - 'mobile: assessment'
      summary: Bắt đầu hoặc tiếp tục bài đánh giá
      operationId: start_api_v1_children__child_id__assessment_assessments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Child Id
      - name: tz
        in: query
        required: false
        schema:
          type: integer
          maximum: 840
          minimum: -720
          default: 420
          title: Tz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBody'
            example:
              id: 11111111-1111-4111-8111-111111111111
              chronological_guidance_confirmed: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '422':
          description: Request validation errors (detail array) or business validation failure (detail
            string).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ServiceError'
        '401':
          description: Missing, expired or invalid access token/session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account unavailable, insufficient permission or read-only child access.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '404':
          description: Resource missing or child access hidden from this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '503':
          description: Authentication not configured or required published content unavailable.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '409':
          description: Version conflict, invalid lifecycle state or unavailable milestone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
      description: 'Requires edit access. The client supplies a UUID for retry idempotency. An existing
        ID for this child or an existing draft at the current milestone is returned. Success is HTTP 200,
        including creation. Published active question revisions are pinned when starting. 409: no eligible
        age or missing guidance confirmation/content changed. 503: published content is unavailable.'
  /api/v1/children/{child_id}/assessment/assessments/{attempt_id}:
    get:
      tags:
      - 'mobile: assessment'
      summary: Xem bài đánh giá và kết quả đã lưu
      operationId: load_api_v1_children__child_id__assessment_assessments__attempt_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Child Id
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: tz
        in: query
        required: false
        schema:
          type: integer
          maximum: 840
          minimum: -720
          default: 420
          title: Tz
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '422':
          description: Request validation errors (detail array) or business validation failure (detail
            string).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ServiceError'
        '401':
          description: Missing, expired or invalid access token/session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account unavailable, insufficient permission or read-only child access.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '404':
          description: Resource missing or child access hidden from this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '503':
          description: Authentication not configured or required published content unavailable.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
      description: Requires view access. Completed attempts use immutable question/result snapshots. Old-milestone
        drafts remain readable with editable=false. Missing attempts return 404.
    patch:
      tags:
      - 'mobile: assessment'
      summary: Lưu đáp án của bài đang làm
      operationId: save_api_v1_children__child_id__assessment_assessments__attempt_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Child Id
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: tz
        in: query
        required: false
        schema:
          type: integer
          maximum: 840
          minimum: -720
          default: 420
          title: Tz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveBody'
            example:
              expected_version: 1
              answers:
                CDC-12-01: achieved
              regression: 'no'
              caregiver_concern: 'no'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '422':
          description: Request validation errors (detail array) or business validation failure (detail
            string).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ServiceError'
        '401':
          description: Missing, expired or invalid access token/session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account unavailable, insufficient permission or read-only child access.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '404':
          description: Resource missing or child access hidden from this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '503':
          description: Authentication not configured or required published content unavailable.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '409':
          description: Version conflict, invalid lifecycle state or unavailable milestone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
      description: 'Requires edit access at the current milestone. expected_version must match version;
        a successful save increments version. Supplied answers are upserted by question code; omitted
        answers remain saved. Both parent signals are assigned from this request (omitted/null resets
        them to null). 409: stale version, completed attempt or expired milestone. Unknown question codes
        return 422.'
  /api/v1/children/{child_id}/assessment/assessments/{attempt_id}/complete:
    post:
      tags:
      - 'mobile: assessment'
      summary: Hoàn thành bài và lưu kết quả bất biến
      operationId: complete_api_v1_children__child_id__assessment_assessments__attempt_id__complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Child Id
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attempt Id
      - name: tz
        in: query
        required: false
        schema:
          type: integer
          maximum: 840
          minimum: -720
          default: 420
          title: Tz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteBody'
            example:
              expected_version: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '422':
          description: Request validation errors (detail array) or business validation failure (detail
            string).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ServiceError'
        '401':
          description: Missing, expired or invalid access token/session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Account unavailable, insufficient permission or read-only child access.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '404':
          description: Resource missing or child access hidden from this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '503':
          description: Authentication not configured or required published content unavailable.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthError'
                - $ref: '#/components/schemas/ServiceError'
        '409':
          description: Version conflict, invalid lifecycle state or unavailable milestone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
      description: 'Requires edit access. All skill answers and both parent signals must be present. For
        an unfinished attempt, expected_version must match. Retrying an already completed attempt returns
        its saved result even if expected_version is old. 422: incomplete answers. 409: stale version
        or expired milestone. 503: published advice unavailable; draft remains saved. Results monitor
        milestones and do not provide a diagnosis or developmental risk score.'
components:
  schemas:
    CompleteBody:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
      type: object
      required:
      - expected_version
      title: CompleteBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SaveBody:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        answers:
          additionalProperties:
            type: string
            enum:
            - achieved
            - not_yet
            - not_observed
          type: object
          title: Answers
        regression:
          anyOf:
          - type: string
            enum:
            - 'yes'
            - 'no'
            - unsure
          - type: 'null'
          title: Regression
        caregiver_concern:
          anyOf:
          - type: string
            enum:
            - 'yes'
            - 'no'
          - type: 'null'
          title: Caregiver Concern
      type: object
      required:
      - expected_version
      - answers
      title: SaveBody
    StartBody:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        chronological_guidance_confirmed:
          type: boolean
          title: Chronological Guidance Confirmed
          default: false
      type: object
      required:
      - id
      title: StartBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AgeMonths:
      type: integer
      enum:
      - 2
      - 4
      - 6
      - 9
      - 12
      - 15
      - 18
      - 24
      - 30
      - 36
      - 48
      - 60
    Answer:
      type: string
      enum:
      - achieved
      - not_yet
      - not_observed
    SummaryCounts:
      type: object
      properties:
        total: &id001
          type: integer
          minimum: 0
        achieved: *id001
        not_yet: *id001
        not_observed: *id001
      required:
      - total
      - achieved
      - not_yet
      - not_observed
    QuestionSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code: &id002
          type: string
        domain: *id002
        revision: *id001
        order_index: *id001
        payload: &id003
          type: object
          additionalProperties: true
        source_refs:
          type: array
          items: *id003
      required:
      - id
      - code
      - domain
      - revision
      - order_index
      - payload
      - source_refs
    ResultView:
      type: object
      properties:
        schema_version: *id002
        rules_version:
          anyOf:
          - *id002
          - type: 'null'
        advice_content_version:
          anyOf:
          - *id002
          - type: 'null'
        question_set_age_months:
          $ref: '#/components/schemas/AgeMonths'
        primary_result_code:
          anyOf:
          - *id002
          - type: 'null'
        reported_flags:
          type: array
          items: *id002
        sections:
          type: object
          properties:
            overview:
              $ref: '#/components/schemas/SummaryCounts'
            overall_comment: *id003
            skills_to_note:
              type: object
              properties:
                total: *id001
                preview_count: *id001
                preview:
                  type: array
                  items: *id003
                all:
                  type: array
                  items: *id003
                has_more:
                  type: boolean
              required:
              - total
              - preview_count
              - preview
              - all
              - has_more
            next_steps:
              type: object
              properties:
                title: *id002
                advice_items:
                  type: array
                  items: *id003
                action_plan:
                  anyOf:
                  - *id003
                  - type: 'null'
                tts_text: *id002
                auto_play:
                  const: false
              required:
              - title
              - advice_items
              - action_plan
              - tts_text
              - auto_play
          required:
          - overview
          - overall_comment
          - skills_to_note
          - next_steps
        disclaimer: *id002
        release_status: *id002
        question_snapshot:
          type: array
          items:
            $ref: '#/components/schemas/QuestionSnapshot'
        preview_diagnostics: *id003
      required:
      - schema_version
      - rules_version
      - advice_content_version
      - question_set_age_months
      - primary_result_code
      - reported_flags
      - sections
      - disclaimer
      - release_status
    ServiceError:
      type: object
      properties:
        detail: *id002
      required:
      - detail
    AuthError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id002
            message: *id002
            fields: *id003
            details: *id003
          required:
          - code
          - message
          - fields
          - details
      required:
      - error
    AttemptReference:
      type: object
      properties:
        id: &id004
          type: string
          format: uuid
        age_months:
          $ref: '#/components/schemas/AgeMonths'
      required:
      - id
      - age_months
    AssessmentAttempt:
      type: object
      properties:
        id: *id004
        age_months:
          $ref: '#/components/schemas/AgeMonths'
        status:
          type: string
          enum:
          - in_progress
          - completed
        started_at: &id005
          type: string
          format: date-time
        completed_at:
          anyOf:
          - *id005
          - type: 'null'
        version:
          type: integer
          minimum: 1
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Answer'
        regression:
          enum:
          - 'yes'
          - 'no'
          - unsure
          - null
        caregiver_concern:
          enum:
          - 'yes'
          - 'no'
          - null
        editable: &id006
          type: boolean
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionSnapshot'
        result:
          anyOf:
          - $ref: '#/components/schemas/ResultView'
          - type: 'null'
      required:
      - id
      - age_months
      - status
      - started_at
      - completed_at
      - version
      - answers
      - regression
      - caregiver_concern
      - editable
      - questions
      - result
    AssessmentOverview:
      type: object
      properties:
        age_months:
          anyOf:
          - $ref: '#/components/schemas/AgeMonths'
          - type: 'null'
        today: &id007
          type: string
          format: date
        can_edit: *id006
        completed_milestones:
          type: array
          items:
            $ref: '#/components/schemas/AgeMonths'
        latest_completed:
          anyOf:
          - $ref: '#/components/schemas/AttemptReference'
          - type: 'null'
        guidance_required: *id006
        set:
          anyOf:
          - type: object
            properties:
              id: *id004
              count:
                type: integer
                minimum: 0
            required:
            - id
            - count
          - type: 'null'
        draft:
          anyOf:
          - $ref: '#/components/schemas/AssessmentAttempt'
          - type: 'null'
        past_drafts:
          type: array
          items:
            $ref: '#/components/schemas/AttemptReference'
        milestones:
          type: array
          items:
            type: object
            properties:
              age_months:
                $ref: '#/components/schemas/AgeMonths'
              opens_on: *id007
              closes_on: *id007
            required:
            - age_months
            - opens_on
            - closes_on
      required:
      - age_months
      - today
      - can_edit
      - completed_milestones
      - latest_completed
      - guidance_required
      - set
      - draft
      - past_drafts
      - milestones
    AssessmentHistory:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: *id004
              age_months:
                $ref: '#/components/schemas/AgeMonths'
              completed_at: *id005
              summary:
                $ref: '#/components/schemas/SummaryCounts'
              attempt_number:
                type: integer
                minimum: 1
            required:
            - id
            - age_months
            - completed_at
            - summary
            - attempt_number
        has_more: *id006
      required:
      - items
      - has_more
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mobile access JWT and live session.
servers:
- url: http://localhost:8000
