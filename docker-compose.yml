services:
  db:
    image: pgvector/pgvector:pg16
    container_name: track-children-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_DB: track_children
      POSTGRES_USER: track_children
      POSTGRES_PASSWORD: track_children_dev
    ports:
      - "5433:5432"
    volumes:
      - track_children_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_children -d track_children"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-db:
    image: pgvector/pgvector:pg16
    container_name: track-children-ai-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_DB: track_children_ai
      POSTGRES_USER: track_children
      POSTGRES_PASSWORD: track_children_dev
    ports:
      - "5434:5432"
    volumes:
      - track_children_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_children -d track_children_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://track_children:track_children_dev@db:5432/track_children
      AUTH_SECRET: ${AUTH_SECRET:-}
      APP_ENV: ${APP_ENV:-production}
      AUTH_SKIP_OTP: ${AUTH_SKIP_OTP:-false}
      AUTH_OTP_PREVIEW: ${AUTH_OTP_PREVIEW:-false}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-[]}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-[]}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_PATH: ${APPLE_PRIVATE_KEY_PATH:-}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-}
      APPLE_ANDROID_PACKAGE: ${APPLE_ANDROID_PACKAGE:-com.example.track_children}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_TOKEN: ${EMAIL_WEBHOOK_TOKEN:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp2go}
      SMTP2GO_API_KEY: ${SMTP2GO_API_KEY:-}
      SMTP2GO_SENDER_EMAIL: ${SMTP2GO_SENDER_EMAIL:-}
      SMTP2GO_SENDER_NAME: ${SMTP2GO_SENDER_NAME:-Track Children}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Track Children}
      LEGAL_DOCUMENTS_PATH: ${LEGAL_DOCUMENTS_PATH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    depends_on:
      db:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env.example
    environment:
      DATABASE_URL: postgresql://track_children:track_children_dev@ai-db:5432/track_children_ai
      BACKEND_API_URL: http://backend:8000
    depends_on:
      ai-db:
        condition: service_healthy
      backend:
        condition: service_started

  admin-web:
    build: ./admin-web
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
      AI_SERVICE_URL: http://ai-service:8001

volumes:
  track_children_postgres_data:
  track_children_ai_postgres_data:
